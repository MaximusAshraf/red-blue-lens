<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Red/Blue Lens - Make a puzzle</title>
<meta name="description" content="Make red and blue overlapping puzzles of sentences or shapes, preview them through both filters and download them for printing.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap">
<link rel="stylesheet" href="shared.css">
</head>
<body data-title="title_make">
<main>
 <div class="pad">
  <div class="seg"><button id="mt" class="on" data-i="tab_text"></button><button id="ms" data-i="tab_shape"></button><button id="mi" data-i="tab_img"></button></div>

  <div id="txtbox" class="pad" style="padding:0">
    <div class="hint" data-i="hint_text"></div>
    <div class="lbl b" data-i="blue_text"></div>
    <textarea id="tb" class="b"></textarea>
    <div class="lbl r" data-i="red_text"></div>
    <textarea id="tr" class="r"></textarea>
  </div>

  <div id="shpbox" class="pad" style="padding:0" hidden>
    <div class="hint" data-i="hint_shape"></div>
    <div class="lbl b" data-i="blue_shape"></div><select id="sb"></select>
    <div class="lbl r" data-i="red_shape"></div><select id="sr"></select>
    <div class="lbl" data-i="level"></div>
    <select id="lvl"><option value="0" data-i="lv0"></option><option value="1" data-i="lv1"></option><option value="2" data-i="lv2"></option><option value="3" data-i="lv3" selected></option></select>
    <input id="seedv" type="hidden" value="7">
    <div class="row"><button class="mini" id="rnd" data-i="rnd"></button><button class="mini" id="reroll" data-i="reroll"></button></div>
  </div>

  <div id="imgbox" class="pad" style="padding:0" hidden>
    <div class="hint" data-i="hint_img"></div>
    <button class="go" id="pick" data-i="pick_img"></button>
    <input id="file" type="file" accept="image/*" hidden>
  </div>

  <button class="go" id="gen" data-i="gen"></button>
  <div class="trio">
    <figure><figcaption data-i="p_n"></figcaption><canvas id="c0"></canvas></figure>
    <figure><figcaption data-i="p_r"></figcaption><canvas id="c1"></canvas></figure>
    <figure><figcaption data-i="p_b"></figcaption><canvas id="c2"></canvas></figure>
  </div>
  <div class="row"><button class="go" id="dl" data-i="dl" style="flex:1"></button><button class="go" id="cam" data-i="open_cam" style="flex:1"></button></div>
  <h3 data-i="presets"></h3>
  <div class="chips" id="chips"></div>
 </div>
</main>
<script src="shared.js"></script>
<script>
buildHeader();
const W = 1200, H = 800, puz = document.createElement('canvas');
const FONT = s => `900 ${s}px Cairo, "Arial Black", Tahoma, Arial, sans-serif`;
const PRESETS = {
  en: [['Mina went to church early and met George then they bought ice cream', 'Mary hid the gift under the bed and left a clue on a small note'],
       ['He is alive indeed', 'Christ is risen'], ['The treasure is under the tree', 'Open the blue door'],
       ['Look for the present', 'It is in the closet'], ['Happy birthday my friend', 'God bless you always']],
  ar: [['مينا راح الكنيسة الصبح وقابل جورج وبعدها اشتروا آيس كريم', 'مريم خبّت الهدية تحت السرير وكتبت الدليل على ورقة صغيرة'],
       ['المسيح قام', 'بالحقيقة قام'], ['الكنز تحت الشجرة', 'افتح الباب الأزرق'],
       ['دور على الهدية', 'في دولاب مريم'], ['كل سنة وانت طيب', 'ربنا يحفظك']]
};

/* ---- sentences: largest font that fits the whole canvas, auto-wrapped ---- */
function wrap(ctx, words, maxW) {
  const lines = []; let cur = '';
  for (const w of words) { const x = cur ? cur + ' ' + w : w; if (cur && ctx.measureText(x).width > maxW) { lines.push(cur); cur = w; } else cur = x; }
  if (cur) lines.push(cur); return lines;
}
function fit(ctx, text, maxW, maxH) {
  const words = text.replace(/\s+/g, ' ').trim().split(' ').filter(Boolean);
  for (let size = 420; size >= 24; size -= 4) {
    ctx.font = FONT(size);
    if (words.some(w => ctx.measureText(w).width > maxW)) continue;
    const lines = wrap(ctx, words, maxW);
    if (lines.length * size * 1.2 <= maxH) return { lines, size };
  }
  return { lines: words, size: 24 };
}
function drawText(ctx, bt, rt) {
  ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'multiply'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.direction = lang === 'ar' ? 'rtl' : 'ltr';
  [[bt, '#0000ff'], [rt, '#ff0000']].forEach(([txt, col]) => {
    const { lines, size } = fit(ctx, txt || ' ', W * .94, H * .92);
    ctx.font = FONT(size); ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = size * .04; ctx.lineJoin = 'round';
    const lh = size * 1.2, y0 = H / 2 - (lines.length - 1) * lh / 2;
    lines.forEach((l, i) => { ctx.fillText(l, W / 2, y0 + i * lh); ctx.strokeText(l, W / 2, y0 + i * lh); });
  });
  ctx.globalCompositeOperation = 'source-over';
}

/* ---- shapes (unit box -50..50) ---- */
const arc = (c, x, y, r, a = 0, b = Math.PI * 2) => { c.moveTo(x + r * Math.cos(a), y + r * Math.sin(a)); c.arc(x, y, r, a, b); };
const poly = (c, p) => { p.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath(); };
const face = (c, m) => { arc(c, 0, 0, 40); arc(c, -14, -10, 3); arc(c, 14, -10, 3);
  if (m === 'happy') arc(c, 0, 4, 22, .15 * Math.PI, .85 * Math.PI);
  else { arc(c, 0, 34, 22, 1.15 * Math.PI, 1.85 * Math.PI); c.moveTo(-22, -24); c.lineTo(-8, -18); c.moveTo(22, -24); c.lineTo(8, -18); } };
const SHAPES = {
  happy: c => face(c, 'happy'), angry: c => face(c, 'sad'),
  heart: c => { c.moveTo(0, 34); c.bezierCurveTo(-58, -4, -28, -44, 0, -16); c.bezierCurveTo(28, -44, 58, -4, 0, 34); },
  star: c => { const p = []; for (let i = 0; i < 10; i++) { const r = i % 2 ? 17 : 44, a = -Math.PI / 2 + i * Math.PI / 5; p.push([r * Math.cos(a), r * Math.sin(a)]); } poly(c, p); },
  cross: c => { c.moveTo(0, -44); c.lineTo(0, 44); c.moveTo(-28, -16); c.lineTo(28, -16); },
  house: c => { poly(c, [[-32, -2], [32, -2], [32, 38], [-32, 38]]); c.moveTo(-40, -2); c.lineTo(0, -40); c.lineTo(40, -2); c.moveTo(-8, 38); c.lineTo(-8, 14); c.lineTo(8, 14); c.lineTo(8, 38); },
  sun: c => { arc(c, 0, 0, 17); for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; c.moveTo(27 * Math.cos(a), 27 * Math.sin(a)); c.lineTo(44 * Math.cos(a), 44 * Math.sin(a)); } },
  fish: c => { c.ellipse(-6, 0, 32, 20, 0, 0, Math.PI * 2); c.moveTo(24, 0); c.lineTo(46, -18); c.lineTo(46, 18); c.closePath(); arc(c, -20, -5, 3); },
  flower: c => { for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; arc(c, 24 * Math.cos(a), 24 * Math.sin(a), 14); } arc(c, 0, 0, 9); },
  church: c => { poly(c, [[-28, 0], [28, 0], [28, 40], [-28, 40]]); c.moveTo(-34, 0); c.lineTo(0, -20); c.lineTo(34, 0); c.moveTo(0, -20); c.lineTo(0, -46); c.moveTo(-8, -36); c.lineTo(8, -36); c.moveTo(-8, 40); c.lineTo(-8, 22); c.arc(0, 22, 8, Math.PI, 0); c.lineTo(8, 40); },
  tree: c => { arc(c, 0, -14, 26); arc(c, -18, 4, 16); arc(c, 18, 4, 16); c.moveTo(-6, 16); c.lineTo(-6, 44); c.lineTo(6, 44); c.lineTo(6, 16); },
  cat: c => { arc(c, 0, 6, 32); c.moveTo(-28, -14); c.lineTo(-26, -42); c.lineTo(-6, -26); c.moveTo(28, -14); c.lineTo(26, -42); c.lineTo(6, -26); arc(c, -12, 2, 3); arc(c, 12, 2, 3); c.moveTo(-3, 14); c.lineTo(3, 14); c.lineTo(0, 18); c.closePath(); }
};
let seed = 1;
const rng = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; };
function scribble(ctx, col, n, w) {
  ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let i = 0; i < n; i++) {
    ctx.lineWidth = (w || .7) + rng() * .7; ctx.beginPath();
    let x = (rng() - .5) * 130, y = (rng() - .5) * 100; ctx.moveTo(x, y);
    for (let k = 0; k < 4; k++) { const nx = x + (rng() - .5) * 70, ny = y + (rng() - .5) * 60; ctx.quadraticCurveTo(x + (rng() - .5) * 60, y + (rng() - .5) * 60, nx, ny); x = nx; y = ny; }
    ctx.stroke();
  }
}
function drawShapes(ctx, bn, rn) {
  const lvl = +$('#lvl').value; seed = +$('#seedv').value;
  ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'multiply';
  [[bn, '#0000ff'], [rn, '#ff0000']].forEach(([n, col]) => {
    const base = Math.min(W, H) / 100;
    ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(base, base);
    if (lvl > 0) scribble(ctx, col, [0, 10, 22, 52][lvl], lvl === 3 ? .45 : .7);
    ctx.restore(); ctx.save();
    const rot = lvl ? (rng() - .5) * (lvl === 3 ? .7 : 1) : 0, sc = base * (lvl === 3 ? .8 + rng() * .15 : lvl ? .62 + rng() * .3 : .92);
    const dx = lvl ? (rng() - .5) * (lvl === 3 ? 14 : 26) : 0, dy = lvl ? (rng() - .5) * (lvl === 3 ? 10 : 18) : 0;
    ctx.translate(W / 2 + dx * base, H / 2 + dy * base); ctx.rotate(rot); ctx.scale(sc, sc);
    ctx.beginPath(); SHAPES[n](ctx); ctx.strokeStyle = col; ctx.lineWidth = [7, 10, 10, 13][lvl]; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(); ctx.restore();
  });
  ctx.globalCompositeOperation = 'source-over';
}

/* ---- UI ---- */
let pmode = 't';
function render() {
  puz.width = W; puz.height = H; const c = puz.getContext('2d');
  if (pmode === 'i') drawImg(c); else if (pmode === 's') drawShapes(c, $('#sb').value, $('#sr').value); else drawText(c, $('#tb').value, $('#tr').value);
  [['#c0', 'n'], ['#c1', 'r'], ['#c2', 'b']].forEach(([id, m]) => filterInto(W, H, x => x.drawImage(puz, 0, 0), $(id), m, 2.2));
}
let upImg = null;
function drawImg(c) {
  c.fillStyle = '#fff'; c.fillRect(0, 0, W, H);
  if (!upImg) return;
  const k = Math.min(W / upImg.width, H / upImg.height), w = upImg.width * k, h = upImg.height * k;
  c.drawImage(upImg, (W - w) / 2, (H - h) / 2, w, h);
}
function setMode(m) { pmode = m; ['t', 's', 'i'].forEach(x => $('#m' + x).classList.toggle('on', m === x)); $('#txtbox').hidden = m !== 't'; $('#shpbox').hidden = m !== 's'; $('#imgbox').hidden = m !== 'i'; $('#gen').hidden = m === 'i'; render(); }
$('#mi').onclick = () => setMode('i');
$('#pick').onclick = () => $('#file').click();
$('#file').onchange = e => { const f = e.target.files[0]; if (!f) return; const im = new Image(); im.onload = () => { upImg = im; render(); }; im.src = URL.createObjectURL(f); };
$('#mt').onclick = () => setMode('t'); $('#ms').onclick = () => setMode('s');
$('#gen').onclick = render;
$('#tb').oninput = $('#tr').oninput = () => { clearTimeout(window._d); window._d = setTimeout(render, 250); };
$('#sb').onchange = $('#sr').onchange = $('#lvl').onchange = render;
$('#reroll').onclick = () => { $('#seedv').value = Math.random() * 1e6 | 0; render(); };
$('#rnd').onclick = () => { const k = Object.keys(SHAPES); const a = k[Math.random() * k.length | 0]; let b; do { b = k[Math.random() * k.length | 0]; } while (b === a); $('#sb').value = a; $('#sr').value = b; render(); };
$('#dl').onclick = () => { render(); const a = document.createElement('a'); a.download = 'puzzle.png'; a.href = puz.toDataURL('image/png'); a.click(); };
$('#cam').onclick = () => { render(); try { sessionStorage.setItem('rbl_img', puz.toDataURL('image/png')); } catch (e) {} location.href = 'index.html'; };

let prevLang = null;
function fillLang() {
  const keepB = $('#sb').value || 'happy', keepR = $('#sr').value || 'angry';
  ['#sb', '#sr'].forEach(id => { $(id).innerHTML = ''; Object.keys(SHAPES).forEach(k => { const o = document.createElement('option'); o.value = k; o.textContent = t('s_' + k); $(id).appendChild(o); }); });
  $('#sb').value = keepB; $('#sr').value = keepR;
  $('#chips').innerHTML = '';
  PRESETS[lang].forEach(([b, r]) => { const x = document.createElement('button'); x.textContent = b.length > 28 ? b.slice(0, 28) + '…' : b + ' + ' + r; if (b.length <= 28) x.textContent = b + ' + ' + r;
    x.onclick = () => { $('#tb').value = b; $('#tr').value = r; setMode('t'); }; $('#chips').appendChild(x); });
  if (prevLang !== lang) { $('#tb').value = t('def_b'); $('#tr').value = t('def_r'); prevLang = lang; }
  render();
}
window.onLang = fillLang;
applyLang();
(document.fonts && document.fonts.load ? Promise.race([document.fonts.load('900 40px Cairo'), new Promise(r => setTimeout(r, 1500))]) : Promise.resolve()).then(render);
</script>
</body>
</html>
