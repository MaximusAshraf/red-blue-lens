<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Red/Blue Lens</title>
<meta name="description" content="Open your camera with a red or blue filter to reveal hidden overlapping drawings and messages.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap">
<link rel="stylesheet" href="shared.css">
</head>
<body data-title="title_cam">
<main>
  <div id="stage"><canvas id="view"></canvas><div id="msg" data-i="idle"></div></div>
  <div class="bar">
    <div class="modes">
      <button class="m-n on" data-m="n" data-i="mode_n"></button>
      <button class="m-r" data-m="r" data-i="mode_r"></button>
      <button class="m-b" data-m="b" data-i="mode_b"></button>
    </div>
    <div class="row"><label data-i="clarity"></label><input id="k" type="range" min="1" max="5" step="0.1" value="2.2"></div>
    <div class="row">
      <button class="mini" id="start" data-i="start"></button>
      <button class="mini" id="flip" data-i="flip"></button>
      <button class="mini" id="up" data-i="upload"></button>
      <input id="file" type="file" accept="image/*" hidden>
    </div>
    <div class="ex"><span data-i="examples"></span>
      <button data-src="examples/easy.png"><img src="examples/easy.png" alt="easy example"></button>
      <button data-src="examples/hard.png"><img src="examples/hard.png" alt="hard example"></button>
    </div>
  </div>
</main>
<script src="shared.js"></script>
<script>
buildHeader('cam');
let mode = 'n', stream = null, facing = 'environment', still = null, raf = 0;
const view = $('#view'), vid = document.createElement('video');
vid.playsInline = true; vid.muted = true;
const K = () => +$('#k').value;

document.querySelectorAll('.modes button').forEach(b => b.onclick = () => {
  mode = b.dataset.m;
  document.querySelectorAll('.modes button').forEach(x => x.classList.toggle('on', x === b));
  if (still) drawStill();
});
$('#k').oninput = () => { if (still) drawStill(); };

function stopCam() { cancelAnimationFrame(raf); if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; }
async function startCam() {
  still = null; stopCam();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { showErr(); return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
  } catch (e) { showErr(); return; }
  vid.srcObject = stream; await vid.play();
  $('#msg').hidden = true; loop();
}
function showErr() { const m = $('#msg'); m.hidden = false; m.dataset.i = 'cam_err'; m.textContent = t('cam_err'); }
function loop() {
  if (vid.videoWidth) {
    const sc = Math.min(1, 720 / Math.max(vid.videoWidth, vid.videoHeight));
    const w = Math.round(vid.videoWidth * sc), h = Math.round(vid.videoHeight * sc);
    filterInto(w, h, c => c.drawImage(vid, 0, 0, w, h), view, mode, K());
  }
  raf = requestAnimationFrame(loop);
}
function drawStill() {
  const s = still, sc = Math.min(1, 1000 / Math.max(s.width, s.height));
  const w = Math.round(s.width * sc), h = Math.round(s.height * sc);
  filterInto(w, h, c => c.drawImage(s, 0, 0, w, h), view, mode, K());
}
function showImage(src) {
  const im = new Image();
  im.onload = () => { stopCam(); still = im; $('#msg').hidden = true; drawStill(); };
  im.src = src;
}
$('#start').onclick = startCam;
$('#flip').onclick = () => { facing = facing === 'environment' ? 'user' : 'environment'; if (stream) startCam(); };
$('#up').onclick = () => $('#file').click();
$('#file').onchange = e => { const f = e.target.files[0]; if (f) showImage(URL.createObjectURL(f)); };
document.querySelectorAll('.ex button').forEach(b => b.onclick = () => showImage(b.dataset.src));

// a puzzle sent over from the "Make a puzzle" page
try { const d = sessionStorage.getItem('rbl_img'); if (d) { sessionStorage.removeItem('rbl_img'); showImage(d); } } catch (e) {}
window.onLang = () => { const m = $('#msg'); m.textContent = t(m.dataset.i); };
applyLang();
</script>
</body>
</html>
